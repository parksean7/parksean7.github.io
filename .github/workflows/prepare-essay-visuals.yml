name: Prepare essay photographs on draft branch
on:
  push:
    branches: [codex/impossible-visuals-20261101]
    paths: [.github/workflows/prepare-essay-visuals.yml]
permissions:
  contents: write
jobs:
  photographs:
    if: github.ref == 'refs/heads/codex/impossible-visuals-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/impossible-visuals-20261101
      - name: Install image validation dependency
        run: python -m pip install Pillow
      - name: Download and validate the selected licensed originals
        run: |
          python - <<'PY'
          import json, urllib.request, time, hashlib, io
          from pathlib import Path
          from PIL import Image, ImageOps
          root = Path('assets/img/how-the-impossible-gets-built')
          manifest = json.loads((root/'sources.json').read_text())
          for p in manifest['photos']:
              data = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(p['download'], headers={'User-Agent': 'SeanParkResearchBlog/1.0 (licensed editorial image preparation)'})
                      with urllib.request.urlopen(req, timeout=45) as response:
                          data = response.read(25000000)
                      im = Image.open(io.BytesIO(data))
                      im.load()
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(3 * (attempt + 1))
              assert im.width >= 500 and im.height >= 300, p['file']
              original_size = list(im.size)
              im = ImageOps.exif_transpose(im).convert('RGB')
              im.thumbnail((1600,1800))
              out = root/p['file']
              im.save(out, format='JPEG', quality=89, optimize=True, progressive=True)
              p['saved_dimensions'] = list(im.size)
              p['source_dimensions'] = original_size
              p['sha256'] = hashlib.sha256(out.read_bytes()).hexdigest()
              p['changes'] = 'Proportional resizing and JPEG re-encoding only; no crop.'
              print(p['file'], im.size, out.stat().st_size)
          (root/'sources.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n')
          PY
      - name: Save photographs only to the draft branch and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/how-the-impossible-gets-built/
          git rm .github/workflows/prepare-essay-visuals.yml
          git commit -m 'Store licensed essay photographs and remove preparation workflow'
          git push origin HEAD:codex/impossible-visuals-20261101
