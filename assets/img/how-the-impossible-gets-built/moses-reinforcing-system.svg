 <title id="title">Moses’s self-reinforcing political economy</title><desc id="desc">Public works generate economic benefits for banks, contractors, labor unions, and politically connected beneficiaries. Those interests support the authority and cooperation needed for additional public works. A qualitative interpretation of the essay and Caro, not evidence that every payment bought a specific favor.</desc><metadata>
